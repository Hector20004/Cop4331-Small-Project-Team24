<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Neural Contact Console</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles/contact.css">
</head>
<body>
<header class="page-title">
    <h1>NEURAL CONTACT CONSOLE</h1>
    <button onclick="logout()">DEAUTHENTICATE</button>
</header>

  <div class="card-container">
  <div class="card">
      <header>
          <h1>CONTACT LIST</h1>
      </header>

    <!-- SEARCH -->
    <div class="searchbar" style="margin-bottom: 10px">
      <input id="searchText" placeholder="SCAN CONTACTS..." />
      <button onclick="searchContacts()">INITIATE SCAN</button>
        <button onclick="addContact()">+</button>
    </div>
      <div class="contacts-scrollable">
    <!-- TABLE -->
    <table>
      <thead>
        <tr>
          <th>FIRST NAME</th>
          <th>LAST NAME</th>
          <th>CALLSIGN</th>
          <th>EMAIL PROTOCOL</th>
          <th>DATE CREATED</th>
        </tr>
      </thead>
      <tbody id="contactsTable"></tbody>
    </table>
      </div>
  </div>
      <div class="card register">
          <header>
              <h1>EDIT CONTACT</h1>
          </header>
          <div style="display: flex; flex-direction: column; justify-content: space-between; flex: 1;">
              <div>
          <input id="firstName" placeholder="GIVEN NAME" disabled />
          <input id="lastName" placeholder="SURNAME" disabled />
          <input id="phone" placeholder="CALLSIGN / PHONE" disabled />
          <input id="email" placeholder="EMAIL PROTOCOL" disabled />
              </div>
          </div>
          <div style="width: 100%; display: flex; flex-direction: row; justify-content: space-between;">
              <button onclick="saveContact()">SAVE</button>
              <button onclick="deleteContact()">DELETE</button>
          </div>
      </div>
  </div>

    <script src="js/api.js"></script>
  <script src="js/contacts.js"></script>

</body>
</html>
