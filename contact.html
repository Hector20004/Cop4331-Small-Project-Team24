<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Neural Contact Console</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles/contact.css">
</head>
<body>

  <h1 class="page-title">NEURAL CONTACT CONSOLE</h1>

  <div class="card">

    <!-- Top Bar -->
    <div class="topbar">
      <h2 id="welcomeText">WELCOME, OPERATOR</h2>
      <button onclick="logout()">TERMINATE SESSION</button>
    </div>

    <!-- SEARCH -->
    <div style="margin-bottom: 25px;">
      <input id="searchText" placeholder="SCAN CONTACTS..." />
      <button onclick="searchContacts()">INITIATE SCAN</button>
    </div>

    <!-- TABLE -->
    <table>
      <thead>
        <tr>
          <th>FIRST NAME</th>
          <th>LAST NAME</th>
          <th>CALLSIGN</th>
          <th>EMAIL PROTOCOL</th>
          <th>ACTIONS</th>
        </tr>
      </thead>
      <tbody id="contactsTable"></tbody>
    </table>

    <hr style="margin: 35px 0;">

    <!-- ADD CONTACT -->
    <h3>REGISTER NEW CONTACT</h3>
    <input id="firstName" placeholder="GIVEN NAME" />
    <input id="lastName" placeholder="SURNAME" />
    <input id="phone" placeholder="CALLSIGN / PHONE" />
    <input id="email" placeholder="EMAIL PROTOCOL" />
    <button onclick="addContact()">ADD TO NETWORK</button>

  </div>

  <script src="js/contacts.js"></script>

</body>
</html>
