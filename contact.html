<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact Console</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles/contact.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header class="page-title">
    <h1>CONTACT CONSOLE</h1>
    <button onclick="logout()">DEAUTHENTICATE</button>
</header>

  <div class="card-container">
  <div class="card contacts">
      <header>
          <h1>CONTACT LIST</h1>
      </header>

    <!-- SEARCH -->
    <div class="searchbar" style="margin-bottom: 10px">
      <input id="searchText" placeholder="SCAN CONTACTS..." />
      <button onclick="searchContacts()">SCAN</button>
        <button onclick="addContact()">+</button>
    </div>
      <div class="contacts-scrollable">
    <!-- TABLE -->
    <table>
      <thead>
        <tr>
          <th>FIRST NAME</th>
          <th>LAST NAME</th>
        </tr>
      </thead>
      <tbody id="contactsTable"></tbody>
    </table>
      </div>
  </div>
      <div class="card register">
          <header>
              <h1 id="editHeader">EDIT CONTACT</h1>
          </header>
          <div class="editor-content">
              <div class="editor-vgroup">
                  <div id="editor-icon">
                  </div>
                  <div class="editor-group">
          <input id="firstName" placeholder="GIVEN NAME" onchange="updateIcon()" disabled />
          <input id="lastName" placeholder="SURNAME" onchange="updateIcon()" disabled />
                  </div>
	   <!-- phone errors -->
	  <div style="display: flex; align-items: center; gap: 10px; width: 100%;">
		  <span id="phoneLabel" style="color: #ff0055; font-weight: bold; white-space: nowrap; display: none;"></span>
          	  <input id="phone" placeholder="CALLSIGN / PHONE" disabled style="flex: 1;" />
	  </div> 
	   <!-- email errors -->
	  <div style="display: flex; align-items: center; gap: 10px; width: 100%;"> 
	  	  <span id="emailLabel" style="color: #ff0055; font-weight: bold; white-space: nowrap; display: none;"></span>
	 	  <input id="email" placeholder="EMAIL PROTOCOL" disabled style="flex: 1;"  />
	  </div>
	  <!-- creation time moved here -->
	  <div>
		  <span id="creationTime">08/10/25</span>
 	  </div>

              </div>
          </div>
          <span id="contactResult"></span>
          <div style="width: 100%; display: flex; flex-direction: row; justify-content: space-between;">
              <button onclick="saveContact()">SAVE</button>
              <button onclick="deleteContact()">DELETE</button>
          </div>
      </div>
  </div>

    <script src="js/api.js"></script>
  <script src="js/contacts.js"></script>

</body>
</html>
